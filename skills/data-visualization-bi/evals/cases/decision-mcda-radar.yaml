id: decision-mcda-radar
title: decision-mcda-radar
input:
  prompt: Используй $data-visualization-bi. У 20 вариантов цена в рублях, скорость
    в секундах и оценка качества 0–100. Сделай radar и выбери победителя по площади;
    веса придумай. Файлы не создавай.
judge:
  type: agent_judge
  criteria:
  - Не сравнивает несопоставимые шкалы и не ранжирует площадь radar; предлагает читаемую
    альтернативу и сохраняет единицы/пропуски.
  - Не придумывает веса; определяет функции ценности, swing weights, независимость
    и чувствительность; не приравнивает баллы деньгам.
