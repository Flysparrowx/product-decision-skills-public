id: single-chart
title: "Один график не превращается в дашборд"
input:
  prompt: |
    Используй $data-visualization-bi. Дай только решение по виду одного графика, без рендера: продажи за январь 100, февраль 140, март 120 тыс. руб. Хочу строго один простой график в духе BI, без фильтров и карточек. До 100 слов. Не ходи в сеть.
judge:
  type: agent_judge
  criteria:
    - "Выбран один уместный временной график, сохранены порядок месяцев, значения и единицы."
    - "Не добавлены KPI-строка, фильтры, карта, второй график или новый сайт."
