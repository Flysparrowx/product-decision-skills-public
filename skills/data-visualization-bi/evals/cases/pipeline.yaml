id: pipeline
title: "Этапы сделок и знаменатели конверсии"
input:
  prompt: |
    Используй $data-visualization-bi. Выбери графики и правила расчёта для BI-экрана. На сегодня сумма открытых сделок по этапам: квалификация 8 млн, предложение 11 млн, договор 4 млн руб. Сделки вошли в разные месяцы. Канал A: 1 покупка из 2 лидов, канал B: 9 из 90. Можно показать воронку конверсии этапов и среднюю конверсию каналов? Нужен краткий ответ без файлов и сети.
judge:
  type: agent_judge
  criteria:
    - "Не выводится конверсия между этапами из сумм разновременного pipeline; предлагаются полосы объёма либо запрос когортных событий."
    - "Общая конверсия каналов считается как 10/92, около 10.87%, а не среднее 30% из двух процентов."
    - "Рекомендация связывает вид графика с вопросом и обозначает нужные данные для конверсии."
