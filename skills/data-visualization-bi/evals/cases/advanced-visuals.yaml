id: advanced-visuals
title: "Выбирает сложную форму под данные, а не по моде"
input:
  prompt: |
    Используй $data-visualization-bi. Для портфеля из 12 тысяч сделок нужно сравнить срок закрытия по 9 регионам: есть дата закрытия, длительность в днях, регион, менеджер и исход сделки; распределения с длинным хвостом, среднее и медиана расходятся. Предложи один основной вид и один вариант для дальнейшего исследования, объясни ограничения. Данных/файлов не создавай, в сеть не ходи.
judge:
  type: agent_judge
  criteria:
    - "Предпочтён вид распределения по регионам, например box plot с медианой/квартилями и объёмами выборки; не ограничивается средним KPI или одной линией."
    - "Для дальнейшего исследования уместен вариант, сохраняющий наблюдения или форму распределения (например, beeswarm при подвыборке, violin при достаточных данных, ECDF); названы ограничения читаемости/объёма."
    - "Не выдуманы причинные выводы; отмечены хвост, медиана и sample size, а категории/единицы остаются читаемыми."
