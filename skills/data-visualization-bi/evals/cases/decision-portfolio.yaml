id: decision-portfolio
title: decision-portfolio
input:
  prompt: Используй $data-visualization-bi. Продажи трёх продуктов 100, 200, 300.
    Построй BCG и ADL и скажи, какой закрыть. Файлы не создавай.
judge:
  type: agent_judge
  criteria:
  - Не размещает продукты без рынка, роста, знаменателя доли и свидетельств жизненного
    цикла/позиции.
  - Не подменяет отраслевую зрелость возрастом компании, не объявляет закрытие по
    квадранту.
