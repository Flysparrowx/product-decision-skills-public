id: sales
title: "Продажи: перенос структуры без лишней карты"
input:
  prompt: |
    Используй $data-visualization-bi. Предложи краткую спецификацию дашборда продаж в существующем веб-приложении по DataLens Demo Dashboard из библиотеки. Есть строки заказов: дата, канал, товар, сумма, себестоимость. Руководитель сравнивает месяцы и товары. Нужен общий фильтр периода. Географических данных нет. Опиши также поведение на телефоне. Не создавай файлы или сайт, не ходи в сеть.
judge:
  type: agent_judge
  criteria:
    - "Есть объяснённый перенос композиции DataLens, а не только ссылка."
    - "Нет карты, геоданных, выдуманных планов или обязательного перехода в DataLens; соблюдён формат спецификации существующего приложения."
    - "Период влияет согласованно на показатели и детали; определены пустое состояние и мобильная перестройка."
