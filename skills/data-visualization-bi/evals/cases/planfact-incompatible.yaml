id: planfact-incompatible
title: "Красивый составной график не смешивает несовместимые факты"
input:
  prompt: |
    Используй $data-visualization-bi. Хочу общий P&L как на ПланФакте. Выручка компании A за январь: 100 тыс. RUB, начисление без НДС. Затраты филиала B за январь: 50 RUB, правила НДС неизвестны. Чистой прибыли нет, есть валовая маржа 20%. Также есть итог затрат и две статьи, но неизвестно, исчерпывают ли статьи итог. Предложи корректный результат до 180 слов, без вычисления новых показателей, файлов и сети.
judge:
  type: agent_judge
  criteria:
    - "Нет общего денежного графика из разных периметров/масштабов; поддержанные ряды сохранены раздельно с конкретными ограничениями."
    - "Нет выдуманной прибыли или подмены процентов денежной прибылью; неизвестные НДС/состав затрат не признаны подтверждёнными."
    - "Не выдуманы Прочее, равномерная помесячная разбивка или полная структура затрат."
