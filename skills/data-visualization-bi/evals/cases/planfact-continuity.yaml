id: planfact-continuity
title: "ПланФакт сохраняется при расширении BI-библиотеки"
input:
  prompt: |
    Используй $data-visualization-bi. Раньше согласовали по картинке ПланФакта общий P&L. Добавляем DataLens/Tableau. Данные одной компании: январь/февраль, факт, одинаковые рубли и масштаб, один снимок, начисление без НДС. Выручка 100/120, общие затраты 80/90, операционная прибыль 20/30 уже передана источником. Есть также остаток денег 40/35. Предложи краткую спецификацию графика до 220 слов, без кода, файлов и сети.
judge:
  type: agent_judge
  criteria:
    - "Сохранён общий P&L с соседними столбцами выручки/затрат и линией операционной прибыли; все три ряда видны сразу."
    - "Остаток денег отделён от P&L; стадия прибыли не переименована в чистую, числа не пересчитаны."
    - "DataLens/Tableau дополняют принятый образец; нет заявления о просмотре неоткрытых источников или работе скриншота."
