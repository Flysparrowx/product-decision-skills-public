id: visual-legibility
title: "Читабельность сложного графика прогноза"
input:
  prompt: |
    Используй $data-visualization-bi. Есть 24 месяца факта и 6 месяцев прогноза по трём бизнес-линиям; для прогноза даны P10, P50 и P90. Спроектируй короткую спецификацию графика для дашборда: сравнить траектории и диапазон неопределённости, сохранить читаемость без всплывающих подсказок. Не вычисляй новые данные и не ходи в сеть.
judge:
  type: agent_judge
  criteria:
    - "Выбрана форма с явным разделением факта/прогноза и диапазоном неопределённости (например, три small multiples с общей временной осью, медианой и полупрозрачной полосой P10–P90)."
    - "P10/P50/P90 подписаны как квантили, forecast horizon и граница прогноза видны; диапазон не назван вероятностью или планом."
    - "Читаемость обеспечена простыми осями/подписями и устойчивыми цветами; нет перегруженной двойной оси, легенды из девяти линий или зависимости от hover."
