id: aesthetic-cluster-versus-idioculture
title: Общая эстетика отделяется от идиокультуры группы
description: |
  Проверяет классификацию группы, сцены, аудитории, тренда и категории через социологические признаки.

input:
  prompt: |
    Мы нашли в Instagram 90 аккаунтов из Екатеринбурга с одинаковыми винтажными
    куртками, пленочными фото и похожими кофейнями. Они редко отвечают друг другу,
    общего чата, событий и совместной деятельности пока не нашли. Составь DNA этой
    группы, её внутренние роли и правила и перенеси модель в Барселону.

judge:
  type: agent_judge
  model: gpt-5.6-terra
  criteria:
    - "Не выдумывает роли, нормы и групповую DNA; предварительно классифицирует объект как SCENE, TREND, CATEGORY, FUNCTIONAL AUDIENCE или UNKNOWN, а не GROUP."
    - "Для GROUP требует повторяющиеся взаимодействия, совместную практику, локальный репертуар/идиокультуру, нормы, роли, статус, границы, ритуалы и устойчивость во времени."
    - "Проверяет rival explanations: алгоритмическую co-exposure, одного автора/магазин, коммерческую кампанию, туристические места, событие и аналитически навязанную визуальную категорию."
    - "Кодирует одежду и визуальность в контексте ситуации, доступа, сочетаний, источника подражания, локального значения и контрпримеров; не выводит класс, характер или членство по внешности."
    - "Для Барселоны переводит социальную функцию и отдельно проверяет местные места, практики, язык, статус и участников; требует adjacent/negative case и local validation."
