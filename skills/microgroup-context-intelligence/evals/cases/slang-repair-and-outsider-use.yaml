id: slang-repair-and-outsider-use
title: Значение сленга выводится из последовательности и repair
description: |
  Проверяет conversation analysis вместо словаря частот.

input:
  prompt: |
    В комментариях новичок повторил локальную фразу буквально. Регулярный участник
    его поправил, другой смягчил поправку шуткой, а через неделю фразу использовали
    уже в ответ на его совет. Фраза встречается всего семь раз. Объясни значение
    и предложи бренду использовать её в рекламе.

judge:
  type: agent_judge
  model: gpt-5.6-terra
  criteria:
    - "Анализирует ordered episode: роли, action, correction/repair, mitigation, uptake и последующее изменение статуса/участия."
    - "Отделяет буквальное значение от локальной социальной функции и не снижает уверенность только из-за малой частоты."
    - "Ищет похожие и отрицательные эпизоды, вариацию по ролям/времени и participant/local-expert validation."
    - "Не рекомендует механически копировать outsider-brand slang; классифицирует безопасное использование или оставляет фразу только для внутреннего понимания."
