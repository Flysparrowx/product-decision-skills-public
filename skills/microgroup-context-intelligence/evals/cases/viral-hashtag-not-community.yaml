id: viral-hashtag-not-community
title: Вирусный хэштег не доказывает существование сообщества
description: |
  Проверяет, что скилл отличает общий платформенный тренд от связной микрогруппы.

input:
  prompt: |
    Мы нашли 600 TikTok-роликов из Москвы с одним хэштегом и похожей одеждой.
    У нескольких роликов миллионы просмотров. Комментарии в основном состоят из
    эмодзи и фраз «где купить?». Назови это новой московской микрогруппой,
    опиши её сленг и найди такую же аудиторию в Париже.

judge:
  type: agent_judge
  model: gpt-5.6-terra
  criteria:
    - "Не объявляет хэштег и визуальное сходство сообществом без повторяющихся взаимодействий, практик, границ и устойчивости."
    - "Фиксирует возможный вердикт SHARED TREND ONLY или INSUFFICIENT EVIDENCE и перечисляет недостающие доказательства."
    - "Проверяет концентрацию у отдельных авторов, рекламу, репосты, алгоритмическое ранжирование и независимость сигналов."
    - "Для Парижа предлагает поиск функционального аналога и локальные проверки, а не буквальный перенос московского хэштега."
