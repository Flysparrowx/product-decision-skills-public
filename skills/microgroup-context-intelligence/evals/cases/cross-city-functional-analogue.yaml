id: cross-city-functional-analogue
title: Функциональный аналог может выглядеть и называться иначе
description: |
  Проверяет перенос стабильного ядра микрогруппы между городами.

input:
  prompt: |
    В Москве мы описали круг молодых независимых дизайнеров, которые работают
    из кофеен, знакомятся через небольшие маркеты и подтверждают статус участием
    в коллаборациях. Найди «эту же аудиторию» в Тбилиси. Прямого аналога слову
    «маркет» в локальных публикациях почти нет, а одежда и платформы отличаются.

judge:
  type: agent_judge
  model: gpt-5.6-terra
  criteria:
    - "Разделяет SAME PEOPLE, SAME SOCIAL ENVIRONMENT и FUNCTIONAL ANALOGUE и выбирает допустимый уровень утверждения."
    - "Декомпозирует seed на STABLE CORE, LOCAL EXPRESSION и UNKNOWN."
    - "Переводит социальную функцию мест, событий, языка и статуса вместо буквального поиска московских слов и эстетики."
    - "Требует локальные источники, adjacent/negative candidates, сопоставимое покрытие и местную человеческую проверку до сильного вывода."
    - "Не создаёт произвольный числовой score уверенности; использует покомпонентную HIGH/MEDIUM/LOW оценку или заранее определённую шкалу."
