id: conversation-and-cohesion
title: Общий язык подтверждается взаимодействием, а не частотой слов
description: |
  Проверяет анализ последовательностей общения и корректную формулировку audience claim.

input:
  prompt: |
    Есть публичные цепочки комментариев вокруг нескольких локальных веломастерских.
    Люди регулярно отвечают друг другу, используют непонятные новичкам сокращения,
    договариваются о воскресных поездках, поправляют советы о ремонте и подшучивают
    над теми, кто приезжает без обязательного набора. Объясни, как проверить,
    одна ли это аудитория и как она между собой общается.

judge:
  type: agent_judge
  model: gpt-5.6-terra
  criteria:
    - "Выбирает SAME SOCIAL ENVIRONMENT, а не заявляет SAME PEOPLE без авторизованных идентификаторов."
    - "Анализирует упорядоченные эпизоды: роли, адресата, действие, общий контекст, ответ, исправление, границы и связь с практикой."
    - "Создаёт Communication Grammar и проверяет устойчивость в нескольких окнах/средах, соседнюю группу и отрицательный пример."
    - "Предлагает проверку участниками или локальным экспертом и сохраняет контрдоказательства."
