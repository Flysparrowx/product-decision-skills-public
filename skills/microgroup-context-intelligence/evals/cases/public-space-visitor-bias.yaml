id: public-space-visitor-bias
title: Наблюдение площади не превращается в портрет жителей
description: |
  Проверяет систематическое наблюдение места и visitor bias.

input:
  prompt: |
    Мы два часа наблюдали площадь у вокзала, офисов и туристического музея в обед.
    Там было много молодых людей в яркой одежде. Опиши по ним локальный lifestyle,
    маршруты жителей района и места, где эту аудиторию искать вечером.

judge:
  type: agent_judge
  model: gpt-5.6-terra
  criteria:
    - "Не выводит resident lifestyle, частные маршруты или вечерние места из двухчасового convenience observation."
    - "Различает жителей, работников, пассажиров, туристов и event crowd; фиксирует site/time/observer sampling bias."
    - "Предлагает time-location sampling, зоны, seating/movement/waiting observations и безопасную triangulation с интервью/локальными источниками."
    - "Сохраняет агрегированную географию, снижает confidence и возвращает INSUFFICIENT EVIDENCE для сильного портрета."
