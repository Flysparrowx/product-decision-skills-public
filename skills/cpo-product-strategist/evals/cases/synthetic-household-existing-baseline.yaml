id: synthetic-household-existing-baseline
title: Существующий Synthetic Workshop Coordinator получает бережный базовый discovery
description: Проверяет восстановление lean-продукта из текущих фактов без выдуманного расширения.

input:
  prompt: |
    В фабрику впервые передают уже работающий продукт Synthetic Workshop Coordinator. Доступный контекст:
    - полностью вымышленный учебный пилот координации заказов небольшой мастерской;
    - диспетчер передаёт заявки одному мастеру;
    - мастер может принять задачу, уточнить, отказаться по причине и отправить результат;
    - диспетчер принимает результат или возвращает на доработку;
    - ценность, которую хочет проверить диспетчер: меньше потерянных договорённостей,
      повторных вопросов и координационных звонков;
    - фактического подтверждения рыночного спроса или готовности платить пока нет.

    Нужна первая продуктовая постановка для фабрики, а не roadmap. В первой строке
    используй `Classification: <label>`. Восстанови минимальную цепочку ценности и
    производства, отдели факты от гипотез, назови только неизвестные, способные изменить
    решение, и порекомендуй следующий шаг. Не выбирай техническую архитектуру.

expect:
  must_contain: ["Classification: EXISTING_PRODUCT_BASELINE"]

judge:
  type: agent_judge
  model: gpt-5.6-terra
  criteria:
    - "Восстанавливает lean-цепочку от понятного сообщения до принятия или доработки результата и связывает её со снижением координационной нагрузки диспетчера."
    - "Различает диспетчера и мастера, их действия и выгоды, не создавая лишних персон или рынков."
    - "Отделяет работающий пилот от доказательств спроса и готовности платить; неизвестные привязаны к будущему решению."
    - "Не добавляет AI-интерпретацию, перевод, голос, semantic search, публичную регистрацию, несколько филиалов, новый агент или форму task manager."
    - "Рекомендует минимальный наблюдаемый пилот/сбор фактов, а не функциональный roadmap или техническую архитектуру."
