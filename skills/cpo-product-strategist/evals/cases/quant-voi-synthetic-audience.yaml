id: quant-voi-synthetic-audience
title: Выбрать ценное исследование и не считать AI-персон аудиторией
description: Проверяет value of information, бюджет исследования и границу synthetic evidence.

input:
  prompt: |
    Перед выбором между двумя вариантами детского продукта у нас три неизвестных:
    реальное предпочтение детей, стоимость локального производства и цвет кнопки в кабинете
    редактора. Ошибка в выборе продукта дорога, исследовательский бюджет ограничен.
    Команда предлагает быстро спросить 500 GPT-персон и использовать их ответы как выборку.
    Реальных вероятностей, payoffs и данных пока нет.

    Расставь исследования по value of information и покажи, какой `Decision calculator`
    нужен для следующего шага. Не придумывай вероятности или денежные значения.

expect:
  must_contain: ["GPT"]

judge:
  type: agent_judge
  model: gpt-5.6-terra
  criteria:
    - "Ставит предпочтение реальной аудитории и стоимость производства выше декоративного цвета, только если они способны изменить выбор продукта; цвет явно относит к Do not research now или низкому приоритету."
    - "Не считает GPT-персон респондентами, выборкой или количественным доказательством предпочтений; допускает их только для гипотез, проверки инструмента или edge cases."
    - "Не выдумывает вероятности и payoffs: даёт качественный VOI или символическую expected decision loss model с input request, research cost/delay и решениями, которые могут измениться."
    - "Предлагает Decision calculator, связывающий варианты, plausible states, loss of wrong choice, evidence cost и resulting action; не выдаёт каталог калькуляторов."
