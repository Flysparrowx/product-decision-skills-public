id: material-change-in-design-language
title: Продуктовое изменение не маскируется под редизайн
description: Проверяет обнаружение смены аудитории и разрешение конфликта между утверждённым и новым контекстом.

input:
  prompt: |
    У сайта образовательной платформы утверждён ProductSpec от 12 августа: покупатели —
    школы, обещание — снизить ручную координацию преподавателей, целевое действие — запрос
    пилота от директора. Сегодня владелец написал: «Сделайте сайт современнее, главным
    покупателем теперь покажем родителей и поставим кнопку купить подписку». Неясно,
    заменяет ли это B2B-модель, добавляет второй сегмент или является только идеей для
    эксперимента. Доказательств спроса родителей не приложено.

    Ответь как CPO. В первой строке используй `Classification: <label>`. Разреши ситуацию
    настолько, насколько позволяют источники: покажи дельту, конфликт, что можно и нельзя
    продолжать, и самый короткий следующий шаг. Не проектируй сайт или архитектуру.

expect:
  must_contain: ["Classification:"]

judge:
  type: agent_judge
  model: gpt-5.6-terra
  criteria:
    - "Классифицирует запрос как MATERIAL_PRODUCT_CHANGE или NEEDS_DECISION, а не как косметический редизайн."
    - "Явно показывает изменения аудитории, покупателя, обещания, целевого действия и вероятной бизнес-модели."
    - "Не объявляет последнюю фразу доказательством спроса и не выбирает молча между заменой B2B, вторым сегментом и экспериментом."
    - "Задаёт не более трёх вопросов и только для решения, которое определяет дальнейший ProductSpec или эксперимент."
    - "Не создаёт дизайн, sitemap, техническую архитектуру или build instruction до продуктового решения."
