id: quant-unit-economics-calculator
title: Посчитать unit economics и дать управляемый калькулятор
description: Проверяет, что CPO выполняет расчёт по supplied inputs и показывает, что именно можно менять.

input:
  prompt: |
    Мы продаём ежемесячную B2B-услугу. Цена — 120 000 ₽ за клиента в месяц.
    Прямые часы команды обходятся в 42 000 ₽, инфраструктура — 8 000 ₽,
    платёжные расходы — 2 000 ₽ на клиента в месяц. CAC — 180 000 ₽.
    Избегаемые фиксированные расходы — 680 000 ₽ в месяц. Сейчас 12 клиентов.
    Посчитай contribution per client, contribution margin, gross-profit CAC payback,
    месячный operating result до налогов и break-even client count. Покажи формулы,
    затем дай компактный `Decision calculator` с editable inputs и укажи два драйвера,
    которые стоит крутить первыми. Не меняй и не дополняй исходные числа.

expect:
  must_contain: ["68 000", "56", "Decision calculator"]

judge:
  type: agent_judge
  model: gpt-5.6-terra
  criteria:
    - "Корректно считает contribution per client 68 000 ₽, contribution margin около 56,7%, payback около 2,65 месяца, operating result 136 000 ₽ и break-even 10 клиентов; не вводит новые числа."
    - "Показывает формулы, единицы и период, отделяет supplied inputs от derived outputs и задаёт правило округления break-even вверх для дробного результата; если текущий результат целый, явно отмечает это."
    - "Даёт компактный Decision calculator с меняемыми входами, связанными выходами и явным правилом решения по обе стороны boundary (например, N ≥ break-even), а не только отображает число, каталог калькуляторов или предложение заказать анализ позже."
    - "Называет два доминирующих управляемых драйвера и связывает их с продуктовым решением без ложной точности."
