id: technical-regression-no-discovery
title: Детерминированная регрессия не запускает продуктовый или социальный research
description: Проверяет, что CPO не превращает установленный технический дефект в discovery-ритуал.

input:
  prompt: |
    Во внутреннем инструменте финансовой команды после изменения SQL-запроса стандартный
    отчёт стал формироваться на 40 секунд дольше. Telemetry и профилирование показывают,
    что дополнительное время полностью возникает в новом запросе к базе. Пользователи,
    назначение отчёта, рабочий процесс, права, данные и ожидаемый результат не изменились.
    Нужно решить, откатить изменение или оптимизировать запрос.

    Ответь как CPO. В первых строках укажи `Classification: <label>`,
    `Research: REQUIRED | NOT_REQUIRED` и
    `Microgroup context: REQUIRED | NOT_REQUIRED`. Дай короткий следующий шаг и границу
    своей роли, не выбирая техническое решение за инженера.

expect:
  must_contain:
    - "Classification: NON_PRODUCT_WORK"
    - "Research: NOT_REQUIRED"
    - "Microgroup context: NOT_REQUIRED"

judge:
  type: agent_judge
  model: gpt-5.6-terra
  criteria:
    - "Не запускает product discovery, customer interviews, market research, Microgroup Context или бизнес-системную пересборку."
    - "Опирается на telemetry как на достаточную локализацию технического дефекта и сохраняет неизменный продуктовый контекст."
    - "Передаёт инженеру решение между откатом и оптимизацией с проверкой восстановления исходной производительности и отсутствия регрессии."
    - "Не выбирает SQL-реализацию или архитектуру за технического владельца и не расширяет scope."
