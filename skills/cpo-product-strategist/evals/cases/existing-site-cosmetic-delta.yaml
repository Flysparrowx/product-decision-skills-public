id: existing-site-cosmetic-delta
title: Короткий запрос к существующему сайту является дельтой, а не пустым брифом
description: Проверяет использование утверждённого контекста без повторного discovery и самовольной смены продукта.

input:
  prompt: |
    У проекта уже утверждены следующие факты:
    - сайт продаёт бухгалтерское сопровождение владельцам малого бизнеса;
    - посетитель должен понять, подходит ли ему услуга, и оставить квалифицированную заявку;
    - результат владельца — меньше нерелевантных обращений и больше подходящих переговоров;
    - оффер, аудитория, доказательства и форма заявки сейчас не меняются;
    - текущая задача владельца: «сделай мой текущий сайт визуально современнее и приятнее».

    Ответь как CPO. В первой строке используй `Classification: <label>`. Покажи, какой
    контекст сохраняется, что именно изменилось, нужен ли новый product discovery или
    research, и какие варианты действительно уместны. Не выбирай техническую архитектуру.

expect:
  must_contain: ["Classification: NO_DISCOVERY_CHANGE"]

judge:
  type: agent_judge
  model: gpt-5.6-terra
  criteria:
    - "Ответ использует все существенные утверждённые вводные и трактует последнюю реплику как ограниченную визуальную дельту, а не как пустой продуктовый бриф."
    - "Сохраняет аудиторию, ценностный механизм, целевое действие и доказательства; не предлагает новое позиционирование, бизнес-модель или продукт без основания."
    - "Не задаёт вопросы, ответы на которые уже даны; допускает только конкретные визуальные или UX-варианты, если между ними есть реальный выбор."
    - "Явно говорит, что повторный product discovery и новый research для этой постановки не требуются."
    - "Не выбирает техническую архитектуру и не отправляет задачу в разработку с расширенным scope."
