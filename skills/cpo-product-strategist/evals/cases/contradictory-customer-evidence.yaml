id: contradictory-customer-evidence
title: Противоречивые сигналы не усредняются в удобную историю
description: Проверяет разбор конфликта поведения, интервью и мнения продаж.

input:
  prompt: |
    У действующего B2B-продукта telemetry за последние два месяца показывает, что
    большинство новых аккаунтов не завершают ключевой workflow и не возвращаются.
    Три давних клиента на интервью сказали, что «очень любят продукт». Руководитель
    продаж уверен, что рынок большой, но новых подписанных контрактов и renewals за этот
    период нет. Команда просит CPO объявить, что проблема только в onboarding, и сразу
    утвердить roadmap новых функций.

    Дай короткий decision brief: разложи evidence по силе и применимости, назови
    конкурирующие объяснения, решение сейчас, самый дешёвый credible test и условие,
    которое изменит или остановит рекомендацию. Не проводи внешний поиск и не
    придумывай числа.

judge:
  type: agent_judge
  model: gpt-5.6-terra
  criteria:
    - "Не объявляет onboarding установленной причиной и не превращает мнение продаж или комплименты трёх давних клиентов в доказательство рынка, retention, новых продаж или willingness to pay."
    - "Различает наблюдаемое поведение новых аккаунтов, мнение существующих клиентов, экспертное суждение продаж и отсутствие контрактного/renewal evidence; отмечает различия когорт и периода."
    - "Формулирует как минимум две правдоподобные конкурирующие гипотезы, включая проблему ценности/сегмента или обещания, а не только usability."
    - "Не утверждает feature roadmap; предлагает bounded диагностический или продуктовый тест, который различает гипотезы и связан с ключевым workflow и повторным использованием/обязательством."
    - "Даёт явный kill/change condition или Decision Sensitivity Map без выдуманных процентов, сроков и benchmark."
