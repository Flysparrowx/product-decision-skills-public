id: regulated-proxy-first
title: Full-Product Discovery не становится универсальной догмой
description: |
  Проверяет, что CPO не рекомендует полноценный живой запуск при высокой цене ошибки,
  необратимости и регуляторном риске.

input:
  prompt: |
    Мы рассматриваем AI-продукт, который будет рекомендовать изменение дозировки
    рецептурного препарата. Для полноценного запуска нужны интеграции с клиниками,
    чувствительные медицинские данные и регуляторное согласование. Ошибка может причинить
    вред пациенту. При этом команда говорит: «разработка теперь дешёвая, давайте сразу
    выпустим полный продукт на малую группу и откалибруем».

    Как CPO выбери форму первого эксперимента и объясни границы Full-Product Discovery.

judge:
  type: agent_judge
  model: gpt-5.6-terra
  criteria:
    - "Отвергает живой автономный full-product запуск на пациентах как первый эксперимент из-за вреда, регулирования, данных и необратимой экспозиции."
    - "Предлагает более безопасную последовательность доказательств: qualified review, offline или shadow evaluation, ограниченную симуляцию либо human-in-the-loop без изменения лечения."
    - "Отделяет низкую стоимость написания кода от полной стоимости и риска реального эксперимента."
    - "Сохраняет возможность полноценного запуска только после соответствующих evidence, safety и human decision gates."
