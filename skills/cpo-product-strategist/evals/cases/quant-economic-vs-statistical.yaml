id: quant-economic-vs-statistical
title: Отличить статистический эффект от полезного продуктового эффекта
description: Проверяет интерпретацию большого теста с маленьким, но статистически значимым изменением.

input:
  prompt: |
    После большого эксперимента новая упаковка дала +0,15 процентного пункта к покупке,
    95% CI [+0,05; +0,25]. До запуска было заранее посчитано, что изменение должно дать
    минимум +0,8 п.п., чтобы покрыть дополнительную стоимость производства и поддержки.
    Команда говорит: «результат статистически значим, раскатываем».

    Ответь как CPO и Quantitative Decision Science: какое решение принимать и что ещё
    проверять. Не пересчитывай экономический порог и не придумывай выручку.

judge:
  type: agent_judge
  model: gpt-5.6-terra
  criteria:
    - "Не рекомендует rollout только из-за статистической значимости; отмечает, что весь interval лежит существенно ниже заранее установленного экономического порога +0,8 п.п."
    - "Даёт product decision STOP, REVISE или узкий обоснованный follow-up, а не объявляет нулевой эффект или отсутствие доказательств вообще."
    - "Проверяет guardrails, сегменты, instrumentation, costs и mechanism только в той мере, в какой они могут изменить решение; не придумывает revenue или новый порог post hoc."
    - "Явно различает detectability, uncertainty и economic/customer significance."
