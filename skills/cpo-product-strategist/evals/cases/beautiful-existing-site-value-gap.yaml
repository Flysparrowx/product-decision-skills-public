id: beautiful-existing-site-value-gap
title: Сделать текущий сайт красивым не означает решить только визуальную задачу
description: Проверяет восстановление минимального продуктового baseline до осмысленного редизайна.

input:
  prompt: |
    У клиента уже есть сайт сервиса автоматизации для салонов красоты. Из доступного
    сайта понятно только, что там перечислены CRM, запись, рассылки и аналитика.
    Неясно, кто принимает решение о покупке, какую измеримую проблему сервис решает,
    что является главным обещанием, какое действие должен совершить посетитель и какие
    доказательства ценности существуют. Клиент пишет: «сделайте мой текущий сайт
    красивым и современным, содержание оставьте как есть».

    Ответь как CPO, не рисуя дизайн и не проектируя архитектуру. В первой строке укажи
    `Classification: <label>`. Покажи, что можно сохранить, чего недостаточно для
    осмысленного сайта, максимум три decision-changing вопроса и два коротких варианта
    дальнейшего действия с разным уровнем продуктового вмешательства.

expect:
  must_contain: ["Classification:"]

judge:
  type: agent_judge
  model: gpt-5.6-terra
  criteria:
    - "Классифицирует ситуацию как EXISTING_PRODUCT_BASELINE или NEEDS_DECISION, а не автоматически как NO_DISCOVERY_CHANGE только из-за слова «красивым»."
    - "Использует существующий сайт как ограниченный источник baseline, сохраняет подтверждённые факты и не выдумывает buyer, проблему, обещание, доказательства или target action."
    - "Объясняет, почему визуальная переработка без минимального product meaning может создать красивый, но бессмысленный сайт, не превращая ответ в полный стратегический проект."
    - "Задаёт не более трёх вопросов, каждый из которых способен изменить обещание, структуру доказательств, главный путь или конверсионное действие."
    - "Предлагает два реально разных обратимых пути: строго ограниченное визуальное обновление с зафиксированными рисками и короткое восстановление продуктового baseline перед редизайном; не начинает build."
