id: cheap-reversible-full-product
title: Полноценный продукт как предпочтительный эксперимент
description: |
  Проверяет, что CPO самостоятельно выбирает ограниченный запуск целостного продукта,
  когда разработка дешёвая, обратимая, а реальное поведение нельзя увидеть на слабом proxy.

input:
  prompt: |
    Мы — AI-native фабрика цифровых продуктов. Целостный веб-продукт под одну задачу
    можем собрать и пересобрать почти за ту же цену, что кликабельный прототип.
    Риски безопасности и регулирования низкие, есть доступ к небольшой группе реальных
    пользователей, а ключевая гипотеза проявляется только в полном пути: вход,
    получение результата, повторное использование и попытка оплаты.

    Какой эксперимент выбрать первым? Нужны ли обязательные интервью и мокапы до разработки?
    Дай конкретную рекомендацию и контракт запуска.

judge:
  type: agent_judge
  model: gpt-5.6-terra
  criteria:
    - "Самостоятельно рекомендует ограниченный запуск целостного работающего продукта как предпочтительный первый эксперимент в описанных условиях, а не требует обязательной последовательности интервью, рисунков и мокапов."
    - "Объясняет выбор через качество решения-релевантного знания с учётом времени, стоимости, обратимости и совокупной экспозиции риска, а не через догму build-first."
    - "До запуска фиксирует гипотезы, целевой сегмент, наблюдаемое поведение, инструментацию, guardrails и заранее определённое решение continue, redesign или kill."
    - "Ограничивает аудиторию, операционные обязательства и необратимые инвестиции, сохраняя целостный end-to-end опыт."
    - "Не выдаёт сам факт выпуска, первый трафик, похвалу или красивый код за подтверждение ценности."
