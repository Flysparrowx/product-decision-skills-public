id: quant-sample-size-power
title: Рассчитать выборку из экономически значимого эффекта
description: Проверяет power calculation, расчётный ответ и границы метода.

input:
  prompt: |
    В A/B-тесте текущая конверсия в оплату 10%. Улучшение меньше 2 процентных пунктов
    не окупает внедрение. Нужны двусторонний alpha 5%, power 80% и равные группы.
    Рассчитай ориентировочную выборку на группу обычным тестом двух пропорций,
    покажи формулу или метод, допущения и предложи `Sample-size calculator`, где можно
    менять baseline, minimum meaningful effect, alpha, power и attrition. Не выдавай
    статистическую значимость за экономическую.

expect:
  must_contain: ["Sample-size calculator", "alpha", "power", "2"]

judge:
  type: agent_judge
  model: gpt-5.6-terra
  criteria:
    - "Выполняет расчёт, получает разумный порядок около 3,8 тысячи наблюдений на группу до поправки на attrition и показывает метод/допущения; небольшое различие из-за формулы или округления допустимо."
    - "Использует 2 процентных пункта как minimum economically meaningful effect, а не выбирает эффект из удобства или benchmark."
    - "Даёт Sample-size calculator с указанными editable inputs, связанным размером выборки и отдельной поправкой на attrition."
    - "Ограничивает вывод допущениями независимости, экспозиции, анализа по назначению и пригодности normal approximation; не объявляет экономический успех только по p-value."
