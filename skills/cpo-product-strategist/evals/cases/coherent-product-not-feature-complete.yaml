id: coherent-product-not-feature-complete
title: Целостность продукта без лишней feature completeness
description: |
  Проверяет, что Full-Product Discovery означает полноценный узкий опыт, а не строительство
  всей долгосрочной дорожной карты и инфраструктуры до первого наблюдения.

input:
  prompt: |
    Хотим проверить сервис для владельцев небольших кофеен: он получает выгрузку продаж,
    предлагает заказ сырья на неделю и позволяет владельцу подтвердить заказ поставщику.
    Код сделать дёшево. Команда спорит: «полный продукт» означает сразу роли сотрудников,
    мобильные приложения, интеграции со всеми кассами, биллинг, сложную аналитику и поддержку 24/7.

    Определи, что должно считаться полным продуктом для discovery и что сознательно оставить за границей.

judge:
  type: agent_judge
  model: gpt-5.6-terra
  criteria:
    - "Определяет full product как целостный end-to-end опыт для одного узкого сегмента, job и канала, позволяющий наблюдать получение ценности и реальное обязательство."
    - "Не требует feature completeness, масштабной инфраструктуры или реализации долгосрочного roadmap до первого ограниченного запуска."
    - "Включает только необходимые ingestion, recommendation, review, confirmation, measurement и безопасный operational fallback либо явно обоснованный эквивалент."
    - "Явно исключает необязательные роли, платформы, интеграции, аналитику и уровень поддержки, которые не нужны для проверяемого механизма."
    - "Фиксирует решение о продолжении, пересборке или закрытии до интерпретации результатов."
