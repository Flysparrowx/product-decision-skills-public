id: business-system-not-feature-roadmap
title: Пересборка цепочки ценности вместо feature roadmap
description: |
  Проверяет, что на широкую задачу CPO пересобирает всю бизнес-систему,
  а не выдаёт список фич для текущей модели.

input:
  prompt: |
    У нас действующий B2B-бизнес: продаём дорогие кастомные проекты. Клиент сначала
    общается с продажами, затем с аналитиком, потом с руководителем проекта и командой.
    Маржа падает, передачи между людьми тормозят работу, а ценные знания теряются. Папа
    просит CPO «постоянно думать, как пересобрать продукт и цепочку его создания».

    Не задавай вопросы: покажи, как бы ты подошёл к этой задаче прямо сейчас.

judge:
  type: agent_judge
  model: gpt-5.6-terra
  criteria:
    - "Начинает с текущей системы ценности: различает покупателя, обещание, создание и доставку ценности, деньги, данные, решения, обратную связь, узкие места и ручные передачи."
    - "Предлагает не менее двух материально разных конфигураций бизнеса, меняя не только фичи, но также предложение, роли, способ доставки, экономический механизм или накапливаемый актив."
    - "Явно распределяет критическую работу между людьми, AI/кодом, процессом, партнёром или клиентом, сохраняя человеческую ответственность там, где она нужна."
    - "Рекомендует одну конфигурацию и ограниченный целостный тест, который проверяет клиентскую ценность, готовность к обязательству, нагрузку на доставку, качество и экономику; не считает красивый код доказательством хорошего продукта."
    - "Не выбирает техническую архитектуру и не присваивает себе право CEO на капитальные или организационные решения."
