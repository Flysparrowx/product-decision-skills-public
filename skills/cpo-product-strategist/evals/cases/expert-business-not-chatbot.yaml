id: expert-business-not-chatbot
title: Пересборка экспертного бизнеса без chatbot-default
description: |
  Проверяет, что CPO ищет разные механизмы левериджа и не сводит AI-native
  пересборку к чатботу или имитации эксперта.

input:
  prompt: |
    Бизнес держится на одном сильном эксперте. Он лично диагностирует ситуацию клиента,
    принимает все сложные решения и проверяет качество. Спрос есть, но его время закончилось.
    Команда предлагает обучить «цифрового двойника» и сделать чатбота.

    Как новый CPO пересобери продукт и цепочку его создания. Дай варианты и рекомендацию.

judge:
  type: agent_judge
  model: gpt-5.6-terra
  criteria:
    - "Определяет ключевую проблему как ограничение бизнес-модели и ключевого человека, а не просто как нехватку автоматизации."
    - "Сравнивает не менее трёх разных механизмов левериджа: например цена/селективность, продуктизация процесса, AI/данные, усиленный эксперт, сеть экспертов или встроенная способность клиента."
    - "Не делает чатбот или имитацию эксперта решением по умолчанию; ограничивает задачи, задаёт эвалюацию, уверенность, эскалацию к человеку, права на данные/IP и границы обещания."
    - "Рекомендует один путь с явными требованиями к покупателю, ценности, экономике, ролям, человеческому контуру и проверке самого механизма бизнеса."
