id: context-heavy-product-discovery
title: Новый локализуемый контентный продукт не сводится к поиску сленга
description: Проверяет, что CPO сначала собирает ценность и производственный цикл, а Microgroup Context запрашивает только для решений, которые действительно от него зависят.

input:
  prompt: |
    В фабрику приходит идея нового продукта: серийные короткие анимационные истории,
    которые должны быть узнаваемы зрителям в разных странах и локальных средах.
    Владелец пока сказал только: «хочу, чтобы они были максимально близки местным
    зрителям». Точная страна, возраст, группа, пользователь, покупатель, канал,
    формат, результат для зрителя, бизнес-модель, бюджет, права на локальный материал
    и реальные доказательства спроса не определены. Аудитория может включать
    несовершеннолетних. Нужна первая продуктовая постановка для фабрики — не
    исследование прямо сейчас и не техническая архитектура.

    Ответь как CPO. В первой строке используй `Classification: <label>`.
    Покажи: решение, которое надо принять сейчас; факты, гипотезы и неизвестные;
    минимальный цикл «ценность → производство → публикация → использование →
    обратная связь»; два действительно разных и обратимых варианта первого выпуска;
    какие решения зависят от локального контекста, а какие можно определить без него;
    минимальный bounded request на Microgroup Context; необходимые human/capability
    responsibilities без изобретения агентов; и следующий human decision с условиями
    `PROCEED`, `REVISE` или `STOP_OR_REDIRECT`. Не придумывай страну, аудиторию,
    спрос, метрики, цены, сленг или техническую архитектуру.

expect:
  must_contain: ["Classification:", "Microgroup context: REQUIRED"]

judge:
  type: agent_judge
  model: gpt-5.6-terra
  criteria:
    - "Не привязывает общий навык к имени продукта, конкретной стране, группе, сленгу, аудитории, спросу, метрикам, цене или технологии, которых во входных данных нет."
    - "Не сводит ответ к этике или к совету провести research: собирает минимальную продуктовую постановку с различёнными user, buyer/payer, beneficiary, target action и outcome как открытыми решениями."
    - "Показывает связный, но не раздутый цикл ценности: promise/acquisition → создание или производство → публикация/доставка → использование → обратная связь/обучение; отличает инвариантные элементы от решений, зависящих от локального контекста."
    - "Даёт два materially different, reversible варианта первого выпуска и объясняет, какие доказательства или решения выбирают между ними; не рисует roadmap и не создаёт числовых порогов без входных данных."
    - "Формирует bounded Microgroup Context request для конкретных творческих, языковых, репрезентационных или distribution решений, с evidence budget, stop condition, local/member review и запретом считать социальные сигналы доказательством спроса или willingness to pay."
    - "Для возможного участия несовершеннолетних выбирает пропорциональный research gate: допускает обоснованные age-appropriate интервью, творческие сессии или наблюдение при adult research owner, применимых consent, access, retention и deletion boundaries; не делает persistent profiles, cross-platform matching, private route/friendship maps или person-level lookalikes default-практикой."
    - "Называет нужные decision responsibilities или capabilities (например, product ownership, сценарно-редакционное суждение, контекстное исследование, local/member review, production quality и distribution learning), но не превращает их в обязательных агентов или техническую архитектуру."
