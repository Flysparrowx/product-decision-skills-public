id: capability-need-without-agent-sprawl
title: Нужные capabilities не превращаются в зоопарк агентов
description: Проверяет рациональную карту обвязок проекта и reuse-before-build границу.

input:
  prompt: |
    В фабрику пришёл новый проект, для которого пока понятна только цель: регулярно
    выпускать локализуемые образовательные материалы для нескольких стран и каналов.
    Не определены полный производственный цикл, источники контекста, редакционная
    ответственность, контроль качества, локализация, публикация и learning loop.
    Владелец спрашивает: «какие скиллы, обвязки и роли нужны — создадим отдельного агента
    на каждый этап и всё недостающее напишем с нуля?»

    Ответь как CPO. Покажи продуктовые решения и capability outcomes, которые надо
    определить до разработки; минимальный end-to-end цикл; что сначала искать среди
    существующих внутренних и безопасно проверенных открытых решений; когда reuse,
    adapt, human responsibility или build оправданы; и что передать Capability Factory
    и Product Architect. Не выбирай технический стек.

judge:
  type: agent_judge
  model: gpt-5.6-terra
  criteria:
    - "Сначала определяет пользовательскую/покупательскую ценность и минимальный цикл от входного контекста через создание, проверку, локализацию и публикацию до использования и learning, а не начинает со списка агентов."
    - "Формулирует capabilities как требуемые outcomes и decision responsibilities; допускает объединение нескольких обязанностей в одном человеке, скилле, процессе или инструменте."
    - "Применяет рациональный порядок reuse → безопасная проверка открытого решения → adapt → build и не советует писать всё с нуля или скачивать неизвестный код без provenance, license, security и eval проверки."
    - "Различает human/editorial authority, CPO product decision, Capability Factory formation и Product Architect technical structure; не выбирает сервисы, storage, agents или deployment за архитектора."
    - "Рекомендует только минимальные capabilities, которые нужны первому целостному циклу и способны изменить качество/ценность; остальное откладывает по evidence gate."
