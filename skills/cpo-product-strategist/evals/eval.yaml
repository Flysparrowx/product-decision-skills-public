    - evals/cases/regulated-proxy-first.yaml
    - evals/cases/coherent-product-not-feature-complete.yaml
    - evals/cases/business-system-not-feature-roadmap.yaml
    - evals/cases/expert-business-not-chatbot.yaml
    - evals/cases/narrow-question-no-reconstruction.yaml
    - evals/cases/microgroup-context-required.yaml
    - evals/cases/microgroup-context-not-required.yaml
    - evals/cases/decision-sensitivity-map.yaml
    - evals/cases/existing-site-cosmetic-delta.yaml
    - evals/cases/material-change-in-design-language.yaml
